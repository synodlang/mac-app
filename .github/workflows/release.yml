name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag and the changelog
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v0.2.*) ;;
            *) echo "::error::tag $tag does not match v0.2.*"; exit 1 ;;
          esac
          scripts/notes.sh --tag "$tag" > notes.md
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          swift --version
      - run: scripts/fetch-deps.sh
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh --version "${GITHUB_REF_NAME#v}"
      - name: Acceptance
        # TODO(task E): drop the guard once --acceptance is implemented.
        run: |
          if build/Synod.app/Contents/MacOS/Synod --help 2>&1 | grep -q -- '--acceptance'; then
            scripts/acceptance.sh build/Synod.app acc
          else
            echo "acceptance not implemented yet; skipping"
          fi
      - name: Package
        run: |
          source deps.env
          mkdir -p dist
          ditto -c -k --keepParent build/Synod.app "dist/Synod-${GITHUB_REF_NAME}-macos.zip"
          (cd dist && shasum -a 256 Synod-*.zip > SHA256SUMS)
          printf '\nBundles synod %s, player %s, examples %s (%s).\n' \
            "$SYNOD_VERSION" "$PLAYER_VERSION" "$EXAMPLES_VERSION" "$EXAMPLES_COMMIT" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md ${flags[@]+"${flags[@]}"}
