name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag and the changelog
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v0.3.*) ;;
            *) echo "::error::tag $tag does not match v0.3.*"; exit 1 ;;
          esac
          scripts/notes.sh --tag "$tag" > notes.md
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          swift --version
      - run: scripts/fetch-deps.sh
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh --version "${GITHUB_REF_NAME#v}"
      - name: Verify the bundle has the bridge and the skills
        run: |
          codesign --verify --deep --strict build/Synod.app
          codesign --verify --strict build/Synod.app/Contents/Helpers/synod-editor-mcp
          test -f build/Synod.app/Contents/Resources/agent-skills/skills/synod/SKILL.md
      - name: Smoke test
        run: scripts/smoke.sh build/Synod.app smoke.json
      # M9 acceptance, which also runs the M8 smoke test and the Raft 1080p60 video acceptance.
      # The release is created only if this passes.
      - name: M8 and M9 acceptance
        run: scripts/acceptance-m9.sh build/Synod.app acc-m9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-m9
          path: acc-m9
          if-no-files-found: ignore
      # M10 acceptance: completion, prompt bar with the fake claude, editor MCP server (and M9 again).
      # The live Claude check is run by the owner with scripts/acceptance-m10-live.sh.
      - name: M10 acceptance
        run: scripts/acceptance-m10.sh build/Synod.app acc-m10 --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-m10
          path: acc-m10
          if-no-files-found: ignore
      - name: Package
        run: |
          source deps.env
          mkdir -p dist
          ditto -c -k --keepParent build/Synod.app "dist/Synod-${GITHUB_REF_NAME}-macos.zip"
          (cd dist && shasum -a 256 Synod-*.zip > SHA256SUMS)
          printf '\nBundles synod %s, player %s, examples %s (%s) and agent-skills %s.\n' \
            "$SYNOD_VERSION" "$PLAYER_VERSION" "$EXAMPLES_VERSION" "$EXAMPLES_COMMIT" "$AGENT_SKILLS_VERSION" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md ${flags[@]+"${flags[@]}"}
