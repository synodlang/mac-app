name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check line endings, trailing spaces and final newline
        shell: bash
        run: |
          status=0
          count=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            count=$((count + 1))
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::CRLF line endings"
              status=1
            fi
            if grep -qE '[[:space:]]+$' "$f"; then
              echo "::error file=$f::trailing whitespace"
              status=1
            fi
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "::error file=$f::missing newline at end of file"
              status=1
            fi
          done < <(git ls-files -z -- '*.md' '*.swift' '*.sh' '*.yml' '*.html' '*.js' '*.in' '*.env')
          echo "Checked $count file(s)."
          exit $status

  build-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          swift --version
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('deps.env') }}
      - name: Fetch dependencies
        run: scripts/fetch-deps.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Read the pinned compiler tag
        id: pins
        run: grep '^SYNOD_VERSION=' deps.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: synodlang/compiler
          ref: ${{ steps.pins.outputs.SYNOD_VERSION }}
          path: compiler
      - name: Check fixtures match the compiler
        run: scripts/sync-fixtures.sh --check --compiler compiler
      - name: Bundle
        run: scripts/bundle.sh
      - name: Verify signature
        run: codesign --verify --deep --strict build/Synod.app
      - name: Smoke test (every example plays)
        run: scripts/smoke.sh build/Synod.app smoke.json
      - name: Acceptance on tcp (pull requests)
        if: github.event_name == 'pull_request'
        # TODO(task E): short tcp-only run; remove continue-on-error once implemented.
        continue-on-error: true
        run: scripts/acceptance.sh build/Synod.app acc
      - name: Package app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Synod.app dist/Synod-ci-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Synod-app
          path: dist/Synod-ci-macos.zip

  acceptance:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: build-test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('deps.env') }}
      - run: scripts/fetch-deps.sh
      - run: scripts/bundle.sh
      - name: Raft 1080p60 export acceptance
        # TODO(task E): remove continue-on-error once --acceptance is implemented.
        continue-on-error: true
        run: scripts/acceptance.sh build/Synod.app acc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: acc
          if-no-files-found: ignore
