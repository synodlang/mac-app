name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check line endings, trailing spaces and final newline
        shell: bash
        run: |
          status=0
          count=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            count=$((count + 1))
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::CRLF line endings"
              status=1
            fi
            if grep -qE '[[:space:]]+$' "$f"; then
              echo "::error file=$f::trailing whitespace"
              status=1
            fi
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "::error file=$f::missing newline at end of file"
              status=1
            fi
          done < <(git ls-files -z -- '*.md' '*.swift')
          echo "Checked $count file(s)."
          exit $status

  # Later: Swift build and tests (xcodebuild on macos runners).
